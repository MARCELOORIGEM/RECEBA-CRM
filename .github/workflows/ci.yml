# Roda a suíte a cada push e PR.
#
# Os testes de pytest e os roteiros de navegador existiam, mas só rodavam
# quando alguém lembrava. Aqui eles passam a rodar sozinhos, e um PR que quebra
# o financeiro ou a permissão por perfil não chega a ser mesclado.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    name: Testes da API
    runs-on: ubuntu-latest

    services:
      # Mesma versão da pilha do compose. O Supabase roda 17 também.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: miliano
          POSTGRES_PASSWORD: miliano-ci
          POSTGRES_DB: miliano_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miliano -d miliano_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Com DATABASE_URL definida, os testes de `test_repo_pg.py` deixam de
      # ser pulados e rodam contra este banco.
      DATABASE_URL: postgresql://miliano:miliano-ci@localhost:5432/miliano_ci
      JWT_SECRET: ci-apenas-para-teste-nao-usar-em-producao
      FRONTEND_URL: http://localhost:3000
      AMBIENTE: ci
      # A suíte não depende de dado fictício: cada teste cria o que precisa.
      SEED_DEMO_DATA: "false"
      ADMIN_EMAIL: admin@miliano-ci.com.br
      ADMIN_PASSWORD: AdminCI@2026
      MANAGER_EMAIL: gestor@miliano-ci.com.br
      MANAGER_PASSWORD: GestorCI@2026
      REACT_APP_BACKEND_URL: http://localhost:8001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependências
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Conferir o schema contra o código
        # Coluna gravada ou filtrada que o schema não tem vira 500 em produção,
        # na rota que ninguém testou. Aqui ela quebra o PR.
        run: python scripts/conferir_schema.py

      - name: Subir a API
        working-directory: backend
        run: |
          uvicorn server:app --host 127.0.0.1 --port 8001 > api.log 2>&1 &
          echo $! > api.pid

      - name: Esperar a API ficar de pé
        run: |
          # O primeiro boot aplica o schema e cria as contas: dar o start por
          # imediato faria o primeiro teste falhar por corrida, não por bug.
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8001/api/health | grep -q '"database":"up"'; then
              echo "API pronta em ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "A API não subiu. Log:"; cat backend/api.log; exit 1

      - name: pytest
        working-directory: backend
        # -rfE lista no fim cada falha com a mensagem. A saída vai também para
        # um arquivo, lido pelo passo seguinte quando algo quebra.
        run: |
          pytest tests/ -q -rfE 2>&1 | tee pytest.log
          exit ${PIPESTATUS[0]}

      - name: Falhas como anotação
        # Anotação aparece no resumo do PR e da execução — e, em repositório
        # público, é legível sem login, ao contrário do log completo.
        if: failure()
        working-directory: backend
        run: |
          grep -E "^(FAILED|ERROR) " pytest.log | head -40 | sed 's/^/::error::/' || true
          grep -E "Traceback|ERROR \[" api.log | head -5 | sed 's/^/::warning::api.log: /' || true

      - name: Log da API quando algo falha
        if: failure()
        run: cat backend/api.log

  painel:
    name: Build do painel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Instalar dependências
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Compilar
        working-directory: frontend
        # Um build que só quebra na hora do deploy custa caro. Aqui ele quebra
        # no PR, que é onde dá para arrumar barato.
        env:
          REACT_APP_BACKEND_URL: https://exemplo.invalido
          CI: "false"
        run: yarn build

  imagens:
    name: Build das imagens Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: API
        run: docker build -t miliano-api ./backend
      - name: Painel
        run: docker build -t miliano-web --build-arg REACT_APP_BACKEND_URL=https://exemplo.invalido ./frontend
