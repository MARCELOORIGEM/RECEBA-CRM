       escuro do painel. Em 16px, só isso sobrevive. -->
  <rect width="64" height="64" rx="14" fill="#0B0F17"/>
  <defs>
    <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC15E"/>
      <stop offset="0.5" stop-color="#F5A524"/>
      <stop offset="1" stop-color="#DB8E0F"/>
    </linearGradient>
  </defs>
  <path d="M12 42a20 20 0 0 1 40 0" fill="none" stroke="url(#ouro)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="32" cy="46" r="4.5" fill="url(#ouro)"/>
</svg>
