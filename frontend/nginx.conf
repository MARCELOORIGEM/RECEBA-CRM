# Nginx que serve o painel e repassa /api para a API.
#
# Com os dois no mesmo domínio, o cookie de sessão deixa de ser cross-site: não
# precisa de SameSite=None e some uma classe inteira de problema com navegador.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança. O CSP permite as fontes do Google, que o painel
    # usa, e nada além disso.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Arquivos com hash no nome podem ficar em cache para sempre.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # É daqui que sai o IP real usado nos limites por IP da API.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Cadastro é texto; nada aqui precisa de corpo grande.
        client_max_body_size 2m;
    }

    # Aplicação de página única: qualquer rota cai no index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
