# Miliano CRM — pilha completa para produção.
#
#   docker compose up -d --build
#
# Sobe quatro serviços: PostgreSQL, a API, o painel servido por Nginx e o
# Caddy terminando TLS na frente de tudo. Todos os segredos vêm do
# arquivo .env na raiz (veja .env.example) — nenhum valor sensível fica aqui.
#
# Quem já tem um proxy com TLS na infra sobe sem o Caddy:
#   docker compose up -d --build db api web
# e aponta esse proxy para 127.0.0.1:${PORTA_HTTP}.

# Rotação de log, aplicada a todo serviço. Sem isto o driver json-file do
# Docker cresce sem teto até encher o disco da VPS — e disco cheio derruba o
# banco, que é onde está o sistema inteiro.
x-log: &log
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    <<: *log
    environment:
      # Superusuário: administra o servidor. A API NÃO usa esta conta.
      POSTGRES_USER: ${PG_ROOT_USER}
      POSTGRES_PASSWORD: ${PG_ROOT_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      # Lidos pelo script de inicialização para criar o papel da aplicação.
      APP_USER: ${PG_APP_USER}
      APP_PASSWORD: ${PG_APP_PASSWORD}
    volumes:
      - pg_dados:/var/lib/postgresql/data
      - ./infra/postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh:ro
      - ./backups:/backups
    # SEM `ports`: o banco só é alcançável pela rede interna do compose.
    # Publicar 5432 no host é o caminho mais curto para alguém de fora ler
    # CPF e conta bancária.
    deploy:
      resources:
        limits:
          memory: ${MEM_DB:-1g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_ROOT_USER} -d ${DB_NAME}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./backend
    restart: unless-stopped
    <<: *log
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Porta 5432 direta, sem pgbouncer: o pool fica na própria API.
      DATABASE_URL: postgresql://${PG_APP_USER}:${PG_APP_PASSWORD}@db:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MANAGER_EMAIL: ${MANAGER_EMAIL}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD}
      TIMEZONE: ${TIMEZONE:-America/Sao_Paulo}
      # Também decide o CORS: em "producao" a lista é só o domínio real.
      AMBIENTE: ${AMBIENTE:-producao}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      ALLOW_PUBLIC_REGISTER: ${ALLOW_PUBLIC_REGISTER:-false}
      # Há um Nginx (e o Caddy) na frente reescrevendo X-Forwarded-For.
      TRUSTED_PROXY: "true"
      SENTRY_DSN: ${SENTRY_DSN:-}
      PRIVACIDADE_URL: ${PRIVACIDADE_URL:-}
      # Teto de envios do formulário público por IP, por hora.
      MAX_ENVIOS_POR_IP: ${MAX_ENVIOS_POR_IP:-10}
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: ${MEM_API:-1g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./frontend
      args:
        # O endereço da API entra no bundle em tempo de build — não dá para
        # trocar depois sem recompilar.
        REACT_APP_BACKEND_URL: ${PUBLIC_API_URL}
    restart: unless-stopped
    <<: *log
    depends_on:
      - api
    # Publicado só no loopback: quem fala com a internet é o Caddy, em HTTPS.
    # Antes isto saía em 0.0.0.0, deixando a porta HTTP aberta ao lado da
    # HTTPS — e o cookie de sessão viaja sem `Secure` por ela.
    ports:
      - "${BIND_HTTP:-127.0.0.1}:${PORTA_HTTP:-8080}:80"
    deploy:
      resources:
        limits:
          memory: ${MEM_WEB:-256m}

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    <<: *log
    depends_on:
      - web
    environment:
      DOMINIO: ${DOMINIO}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      # Os certificados vivem aqui. Perder este volume faz o Caddy pedir tudo
      # de novo à Let's Encrypt, que limita emissões por domínio por semana.
      - caddy_dados:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: ${MEM_PROXY:-256m}

volumes:
  pg_dados:
  caddy_dados:
  caddy_config:
